name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare canonical runtime inputs
        run: python setup_workspace.py
      - name: Run revenue join and anomaly audit
        run: python revenue_audit.py
      - name: Decompose coverage baseline and report solver readiness
        run: python objective_layer_readiness.py
      - name: Run regression tests
        run: python -m pytest -q tests
      - name: Upload revenue/objective audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revenue-objective-audit
          path: |
            output/revenue_audit/
            output/objective_readiness/
          if-no-files-found: error
