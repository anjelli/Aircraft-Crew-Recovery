name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare canonical runtime inputs
        run: python setup_workspace.py
      - name: Run regression tests
        run: python -m pytest -q tests
      - name: End-to-end disruption and retiming recovery test
        timeout-minutes: 10
        run: >-
          python scripts/run_disruption_recovery.py
          --scenario-file scenarios/demo_disruption_1w.json
          --output-dir output/disruption_demo
          --max-retimed-flights 2
          --retime-options=0,5,10
          --time-limit-seconds 10
          --require-positive-retiming
      - name: Audit supplied aircraft line baseline against MGT
        run: python scripts/audit_aircraft_line_baseline.py
      - name: Solve and export 1W, 1M, and 154D baseline schedules
        timeout-minutes: 20
        run: python scripts/run_joint_recovery_horizons.py --time-limit-seconds 180
      - name: Upload recovery schedules and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-schedules
          path: |
            output/joint_recovery/
            output/one_week_joint_recovery/
            output/disruption_demo/
            output/audit/
          if-no-files-found: warn
